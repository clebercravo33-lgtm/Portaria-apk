<script>
(function(){
  let active=false, controls=null;
  function fireInput(el,val){
    const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set; setter.call(el,val); el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); }
  function findKeyInput(){return [...document.querySelectorAll('input')].find(x=>x.placeholder&&x.placeholder.includes('3226 0931'))}
  async function startCamera(){
    if(active)return; active=true;
    const old=document.querySelector('.fixed.inset-0.z-50'); if(!old){active=false;return;}
    old.innerHTML=''; old.className='fixed inset-0 z-[70] bg-black flex items-center justify-center p-3';
    const box=document.createElement('div'); box.style.cssText='width:min(100%,520px);background:#0f172a;color:white;border-radius:18px;padding:14px;box-sizing:border-box';
    box.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font:700 16px system-ui"><span>📷 Ler código da NF-e</span><button id="realCamClose" style="border:0;background:#334155;color:white;border-radius:10px;padding:8px 12px">✕</button></div><div style="position:relative;border-radius:14px;overflow:hidden;background:#000"><video id="realCamVideo" autoplay muted playsinline style="width:100%;height:auto;display:block;min-height:260px;object-fit:cover"></video><div style="position:absolute;left:8%;right:8%;top:42%;height:16%;border:3px solid #22c55e;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.18)"></div></div><div id="realCamStatus" style="padding:10px 2px 4px;text-align:center;font:500 13px system-ui">Aponte a câmera para o código de barras de 44 dígitos.</div><div style="display:flex;gap:8px;margin-top:8px"><button id="realCamManual" style="flex:1;padding:12px;border:1px solid #475569;background:#1e293b;color:white;border-radius:10px">Digitar chave</button></div>';
    old.appendChild(box);
    const video=box.querySelector('#realCamVideo'), status=box.querySelector('#realCamStatus');
    box.querySelector('#realCamClose').onclick=()=>stopCamera(old);
    box.querySelector('#realCamManual').onclick=()=>{stopCamera(old);};
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      video.srcObject=stream; await video.play();
      const mod=await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');
      const reader=new mod.BrowserMultiFormatReader();
      controls=reader.decodeFromVideoElement(video,(result)=>{
        if(!result)return;
        const raw=(result.getText?result.getText():String(result)).replace(/\D/g,'');
        const key=raw.match(/\d{44}/)?.[0];
        if(key){
          status.textContent='✅ Chave de 44 dígitos lida. Preenchendo...';
          const input=findKeyInput(); if(input) fireInput(input,key);
          setTimeout(()=>{ const btn=[...old.querySelectorAll('button')].find(b=>b.textContent.includes('Confirmar')); if(btn)btn.click(); },250);
          setTimeout(()=>stopCamera(old),450);
        } else status.textContent='Código detectado, mas não contém 44 dígitos. Aponte para o código da NF-e.';
      });
    }catch(e){
      status.textContent='Não foi possível abrir a câmera. Verifique a permissão de câmera e use HTTPS (GitHub Pages).';
      console.error(e);
    }
  }
  function stopCamera(old){
    try{controls?.stop();}catch(e){} controls=null;
    const v=old?.querySelector('#realCamVideo'); try{v?.srcObject?.getTracks().forEach(t=>t.stop());}catch(e){}
    active=false;
    const close=[...document.querySelectorAll('button')].find(b=>b.textContent.trim()==='✕');
    if(old&&old.isConnected) old.remove();
  }
  function hook(){
    [...document.querySelectorAll('button')].forEach(b=>{
      if(b.dataset.realCamHook)return;
      if(b.textContent.includes('Scanner')){b.dataset.realCamHook='1';b.addEventListener('click',()=>setTimeout(startCamera,50));}
    });
  }
  new MutationObserver(hook).observe(document.documentElement,{childList:true,subtree:true}); hook();
})();
</script>
